<!DOCTYPE html>
<!--
  Template for a new project page. See "Adding a project" in the README.
  Duplicate the whole template/ folder and rename it to the project name (e.g. fragments),
  then rename template.html and template.css to match (fragments/fragments.html,
  fragments/fragments.css), update the stylesheet link below, replace every
  [placeholder] in this file (search for "[") and delete the noindex line. Put the project images in the same folder and point the img
  src attributes at them (the grey placeholder is only for previewing).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex"> <!-- remove this line in the copy -->
  <title>[project name] - SUPERFLUO</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="description" content="[project description]">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SUPERFLUO">
  <meta property="og:title" content="[project name] - SUPERFLUO">
  <meta property="og:description" content="[project description]">
  <meta property="og:url" content="https://superfluo.cc/[name]/[name].html">
  <meta property="og:image" content="https://superfluo.cc/[name]/[preview image].jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="color-scheme" content="light dark">
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="template.css">
  <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
  <script src="/assets/ratio.js" defer></script>
  <script src="/assets/palette.js" defer></script>
  <script src="/assets/home.js" defer></script>
  <script data-goatcounter="https://superfluo.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="switch to dark mode"></button>
  <div id="project-detail">
    <a href="/home.html" id="logo-link" aria-label="SUPERFLUO, home">
      <div id="logo"></div>
    </a>
    <p id="description">
      <i>[project name]</i><br>
      [one-line description]<br>
      [venue, city]<br>
      [dd.mm.yy – dd.mm.yy]
    </p>
    <div id="image-stack">
      <!-- Repeat per image. Use the real pixel size for width/height.
           Keep the first image eager; add loading="lazy" to the rest.
           data-title is the hover label (credit or frame number);
           alt describes what the image shows. -->
      <div class="image-container" data-title="[credit © year]">
        <img src="/assets/placeholder.png" width="1920" height="1920" alt="[what the image shows]">
      </div>
      <p id="caption">[caption]</p>

      <div class="image-container" data-title="[credit © year]">
        <img src="/assets/placeholder.png" width="1920" height="1920" loading="lazy" alt="[what the image shows]">
      </div>
      <p id="caption">[caption]</p>
    </div>
  </div>
</body>
</html>
